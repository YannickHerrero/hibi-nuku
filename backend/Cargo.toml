[package]
name = "hibi-nuku"
version = "0.1.0"
edition = "2024"
description = "Hibi Nuku — Japanese sentence mining server"
publish = false

[lib]
name = "hibi_nuku"
path = "src/lib.rs"

[[bin]]
name = "nuku"
path = "src/main.rs"

[[bin]]
name = "build-jmdict"
path = "src/bin/build_jmdict.rs"

[[bin]]
name = "wk-import"
path = "src/bin/wk_import.rs"

[[bin]]
name = "build-wk-bundle"
path = "src/bin/build_wk_bundle.rs"

[[bin]]
name = "build-frequency"
path = "src/bin/build_frequency.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "fs"] }
http = "1"
subtle = "2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
lindera = { version = "3", features = ["embed-unidic"] }
quick-xml = "0.40"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
percent-encoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
