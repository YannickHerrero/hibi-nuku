[package]
name = "hibi-nuku"
version = "0.1.0"
edition = "2024"
description = "Hibi Nuku — Japanese sentence mining server"
publish = false

[[bin]]
name = "nuku"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
